<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업데이트 소식 — SIREN</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; color: #1a2035; background: #f4f6fa; font-size: 15px; line-height: 1.6; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    h1 { font-size: 24px; font-weight: 800; }
    .lead { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .back { background: none; border: none; color: #2563eb; font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px 0; }
    /* 목록 */
    .card { display: block; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; margin-bottom: 16px; cursor: pointer; text-decoration: none; color: inherit; transition: box-shadow .15s, transform .1s; }
    .card:hover { box-shadow: 0 6px 22px rgba(0,0,0,.08); transform: translateY(-1px); }
    .card-hero { width: 100%; height: 168px; object-fit: cover; display: block; background: #eef2f7; }
    .card-body { padding: 16px 18px; }
    .card-title { font-size: 17px; font-weight: 700; margin-bottom: 5px; }
    .card-meta { color: #9ca3af; font-size: 12.5px; }
    .card-excerpt { color: #4b5563; font-size: 13.5px; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    /* 상세 */
    .detail-hero { width: 100%; max-height: 320px; object-fit: cover; border-radius: 14px; margin-bottom: 20px; }
    .detail-title { font-size: 25px; font-weight: 800; margin-bottom: 6px; }
    .detail-meta { color: #9ca3af; font-size: 13px; margin-bottom: 22px; }
    .detail-body { font-size: 15.5px; line-height: 1.8; }
    .detail-body h1, .detail-body h2, .detail-body h3 { margin: 22px 0 10px; font-weight: 700; }
    .detail-body h2 { font-size: 19px; } .detail-body h3 { font-size: 16.5px; }
    .detail-body p { margin: 10px 0; }
    .detail-body ul, .detail-body ol { margin: 10px 0 10px 22px; }
    .detail-body li { margin: 5px 0; }
    .detail-body img { max-width: 100%; border-radius: 10px; margin: 12px 0; }
    .detail-body a { color: #2563eb; }
    .detail-body code { background: #f1f5f9; padding: 1px 6px; border-radius: 5px; font-size: 90%; }
    .highlights { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px 18px; margin-top: 26px; }
    .highlights h4 { font-size: 14px; color: #7a1f2b; margin-bottom: 8px; }
    .highlights ul { margin: 0; padding-left: 18px; }
    .highlights li { font-size: 14px; color: #374151; margin-bottom: 6px; }
    .highlights a { color: #2563eb; font-size: 12.5px; margin-left: 6px; }
    .empty, .loading { text-align: center; color: #9ca3af; padding: 60px 0; }
    .err { text-align: center; color: #b91c1c; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>업데이트 소식</h1>
      <button class="back" id="backBtn" style="display:none">← 목록으로</button>
    </div>
    <div class="lead" id="lead">싸이렌의 새 기능과 개선 사항을 확인하세요.</div>
    <div id="content"><div class="loading">불러오는 중…</div></div>
  </div>
  <script src="/js/updates.js?v=20260727"></script>
</body>
</html>
